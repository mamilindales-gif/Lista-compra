<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compra</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F5F2EC;
    --surface: #FFFFFF;
    --ink: #1A1A1A;
    --ink-light: #888;
    --accent: #2C5F2E;
    --accent-light: #E8F0E8;
    --need: #C94040;
    --need-light: #FDF0F0;
    --border: #E0DDD6;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: var(--sans); color: var(--ink); min-height: 100vh; }

  /* LOGIN */
  #login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 24px; text-align: center;
  }
  .login-logo { font-size: 48px; margin-bottom: 16px; }
  .login-title { font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
  .login-sub { font-family: var(--mono); font-size: 12px; color: var(--ink-light); margin-bottom: 40px; }
  .btn-google {
    display: flex; align-items: center; gap: 12px;
    background: white; border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 24px;
    font-family: var(--sans); font-size: 15px; font-weight: 600;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: box-shadow 0.2s;
  }
  .btn-google:active { box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .google-icon { width: 20px; height: 20px; }

  /* APP */
  #app-screen { display: none; padding-bottom: 80px; }

  header {
    background: var(--accent); color: white;
    padding: 20px 20px 16px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  .badge {
    background: var(--need); color: white;
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    padding: 3px 8px; border-radius: 20px; display: none;
  }
  .badge.visible { display: inline-block; }

  .btn-clear {
    background: rgba(255,255,255,0.15); color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 12px; border-radius: 6px;
    font-family: var(--mono); font-size: 11px; cursor: pointer; display: none;
  }
  .btn-clear.visible { display: inline-block; }

  .btn-logout {
    background: rgba(255,255,255,0.15); color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 10px; border-radius: 6px;
    font-family: var(--mono); font-size: 11px; cursor: pointer;
  }

  .sync-status {
    text-align: center; font-family: var(--mono); font-size: 10px;
    padding: 6px; color: var(--ink-light);
    background: var(--surface); border-bottom: 1px solid var(--border); letter-spacing: 0.3px;
  }
  .sync-status.syncing { color: #B07D2C; }
  .sync-status.error { color: var(--need); }
  .sync-status.ok { color: var(--accent); }

  .view-toggle {
    display: flex; margin: 12px 16px;
    background: var(--surface); border-radius: 8px;
    border: 1px solid var(--border); overflow: hidden;
  }
  .toggle-btn {
    flex: 1; padding: 10px; font-family: var(--mono); font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.5px;
    border: none; background: transparent; cursor: pointer; color: var(--ink-light); transition: all 0.15s;
  }
  .toggle-btn.active { background: var(--accent); color: white; }

  .categories { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }

  .category { background: var(--surface); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
  .category-header {
    display: flex; align-items: center; padding: 12px 14px; gap: 10px;
    cursor: pointer; user-select: none; background: var(--surface);
  }
  .cat-emoji { font-size: 18px; }
  .cat-name { font-size: 14px; font-weight: 700; flex: 1; letter-spacing: -0.2px; }
  .cat-count { font-family: var(--mono); font-size: 10px; color: var(--ink-light); }
  .cat-count.has-needs { color: var(--need); font-weight: 500; }
  .cat-chevron { font-size: 10px; color: var(--ink-light); transition: transform 0.2s; }
  .category.collapsed .cat-chevron { transform: rotate(-90deg); }
  .items-list { border-top: 1px solid var(--border); }
  .category.collapsed .items-list { display: none; }

  .item {
    display: flex; align-items: center; padding: 10px 14px; gap: 10px;
    border-bottom: 1px solid var(--border); transition: background 0.1s;
  }
  .item:last-child { border-bottom: none; }

  .drag-handle { color: var(--border); font-size: 14px; cursor: grab; flex-shrink: 0; padding: 2px; touch-action: none; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .sortable-ghost { opacity: 0.35; background: var(--accent-light) !important; }
  .sortable-chosen { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }

  .item-name { flex: 1; font-size: 14px; font-weight: 400; }

  .need-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border);
    background: transparent; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 14px; transition: all 0.15s; flex-shrink: 0;
  }
  .need-btn:active { transform: scale(0.9); }
  .item.needed .need-btn { background: var(--need); border-color: var(--need); color: white; }
  .item.needed .item-name { color: var(--need); font-weight: 600; }
  .item.needed { background: var(--need-light); }

  .delete-btn { opacity: 0; background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0 4px; transition: opacity 0.15s; }
  .item:hover .delete-btn { opacity: 1; }

  .add-item { padding: 8px 14px; border-top: 1px dashed var(--border); }
  .add-btn-full {
    width: 100%; background: transparent; color: var(--accent); border: none;
    font-family: var(--mono); font-size: 12px; font-weight: 500;
    padding: 6px 0; cursor: pointer; text-align: left; letter-spacing: 0.2px;
  }
  .add-btn-full:active { opacity: 0.6; }

  #shopping-view { padding: 0 16px; display: none; }
  #shopping-view.active { display: block; }
  #full-view.hidden { display: none; }

  .shop-empty { text-align: center; padding: 60px 20px; color: var(--ink-light); font-family: var(--mono); font-size: 13px; line-height: 1.8; }
  .shop-category { margin-bottom: 20px; }
  .shop-cat-label { font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-light); margin-bottom: 6px; padding: 0 4px; }
  .shop-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border-radius: 8px; margin-bottom: 4px; border: 1px solid var(--border); cursor: pointer; transition: all 0.15s; }
  .shop-item.checked { opacity: 0.4; text-decoration: line-through; }
  .check-circle { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; }
  .shop-item.checked .check-circle { background: var(--accent); border-color: var(--accent); color: white; }
  .shop-item-name { font-size: 15px; font-weight: 600; }

  .reset-shop { display: block; width: 100%; margin-top: 24px; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; font-family: var(--sans); font-size: 14px; font-weight: 700; cursor: pointer; }

  @media (max-width: 400px) { .item-name { font-size: 13px; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">🛒</div>
  <div class="login-title">Lista de compra</div>
  <div class="login-sub">Inicia sesión para acceder a tu lista</div>
  <button class="btn-google" id="btn-google-login">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continuar con Google
  </button>
</div>

<!-- APP -->
<div id="app-screen">
  <header>
    <h1>🛒 Lista de compra</h1>
    <div class="header-actions">
      <span class="badge" id="need-badge">0 productos</span>
      <button class="btn-clear" id="btn-clear-all">Limpiar</button>
      <button class="btn-logout" id="btn-logout">Salir</button>
    </div>
  </header>
  <div class="sync-status" id="sync-status">Conectando...</div>

  <div class="view-toggle">
    <button class="toggle-btn active" id="btn-full-view" onclick="switchView('full')">📦 Inventario</button>
    <button class="toggle-btn" id="btn-shop-view" onclick="switchView('shop')">✅ Ir a comprar</button>
  </div>

  <div id="full-view">
    <div class="categories" id="categories-container"></div>
  </div>
  <div id="shopping-view">
    <div id="shop-content"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fuzympbfbxaekcnwdotm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dmgUv1ymtPeK4xQoj7Vagw_pw2l9NXE';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const DEFAULT_CATEGORIES = [
  { id: 'frutas',    name: 'Frutas y verduras',  emoji: '🥦', items: ['Plátanos','Manzanas','Tomates','Lechuga','Limones','Zanahorias','Cebollas','Patatas'] },
  { id: 'lacteos',   name: 'Lácteos y huevos',   emoji: '🥛', items: ['Leche sin lactosa','Yogur','Mantequilla','Queso','Huevos'] },
  { id: 'carne',     name: 'Carne y pescado',     emoji: '🥩', items: ['Pollo','Ternera','Salmón','Atún en lata','Jamón'] },
  { id: 'panaderia', name: 'Panadería',           emoji: '🍞', items: ['Pan','Pan de molde','Tortitas de arroz'] },
  { id: 'despensa',  name: 'Despensa',            emoji: '🥫', items: ['Aceite de oliva','Arroz','Pasta','Legumbres','Tomate frito','Caldo'] },
  { id: 'bebidas',   name: 'Bebidas',             emoji: '💧', items: ['Agua','Zumo','Café','Té'] },
  { id: 'congelados',name: 'Congelados',          emoji: '🧊', items: ['Verduras congeladas','Helado'] },
  { id: 'limpieza',  name: 'Limpieza',            emoji: '🧹', items: ['Jabón lavavajillas','Detergente ropa','Papel de cocina','Papel higiénico','Bolsas de basura'] },
  { id: 'higiene',   name: 'Higiene personal',    emoji: '🧴', items: ['Gel de ducha','Champú','Pasta de dientes','Desodorante'] },
  { id: 'otros',     name: 'Otros',               emoji: '🛍️', items: [] },
];

let state = { categories: [], shopChecked: {} };
let currentUser = null;
let sortableInstances = [];
let saveTimeout = null;

function defaultState() {
  return {
    categories: DEFAULT_CATEGORIES.map(c => ({
      ...c, items: c.items.map(name => ({ name, needed: false })), collapsed: false
    })),
    shopChecked: {}
  };
}

function setStatus(msg, type='') {
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-status' + (type ? ' ' + type : '');
}

async function loadFromCloud() {
  setStatus('Cargando...', 'syncing');
  const { data, error } = await sb.from('lista_compra').select('data').eq('user_id', currentUser.id).single();
  if (error || !data || !data.data.categories) {
    state = defaultState();
    await saveToCloud();
  } else {
    state = data.data;
  }
  setStatus('✓ Sincronizado', 'ok');
  renderFull();
  updateBadge();
}

async function saveToCloud() {
  setStatus('Guardando...', 'syncing');
  const { error } = await sb.from('lista_compra').upsert({ user_id: currentUser.id, data: state, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
  if (error) { setStatus('Error al guardar', 'error'); return; }
  setStatus('✓ Guardado', 'ok');
}

function scheduleSave() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveToCloud, 800);
}

function getNeededCount() {
  return state.categories.reduce((acc, cat) => acc + cat.items.filter(i => i.needed).length, 0);
}

function updateBadge() {
  const count = getNeededCount();
  const badge = document.getElementById('need-badge');
  const clearBtn = document.getElementById('btn-clear-all');
  if (count > 0) {
    badge.textContent = count + (count === 1 ? ' producto' : ' productos');
    badge.classList.add('visible');
    clearBtn.classList.add('visible');
  } else {
    badge.classList.remove('visible');
    clearBtn.classList.remove('visible');
  }
}

function renderFull() {
  sortableInstances.forEach(s => s.destroy());
  sortableInstances = [];
  const container = document.getElementById('categories-container');
  container.innerHTML = '';

  state.categories.forEach((cat, catIdx) => {
    const neededInCat = cat.items.filter(i => i.needed).length;
    const catEl = document.createElement('div');
    catEl.className = 'category' + (cat.collapsed ? ' collapsed' : '');

    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `
      <span class="cat-emoji">${cat.emoji}</span>
      <span class="cat-name">${cat.name}</span>
      <span class="cat-count ${neededInCat > 0 ? 'has-needs' : ''}">${neededInCat > 0 ? neededInCat + ' faltan' : cat.items.length + ' items'}</span>
      <span class="cat-chevron">▼</span>
    `;
    header.onclick = () => {
      state.categories[catIdx].collapsed = !state.categories[catIdx].collapsed;
      scheduleSave(); renderFull();
    };

    const list = document.createElement('div');
    list.className = 'items-list';

    cat.items.forEach((item, itemIdx) => {
      const itemEl = document.createElement('div');
      itemEl.className = 'item' + (item.needed ? ' needed' : '');
      itemEl.innerHTML = `
        <span class="drag-handle">⠿</span>
        <button class="need-btn">${item.needed ? '!' : ''}</button>
        <span class="item-name">${item.name}</span>
        <button class="delete-btn">✕</button>
      `;
      itemEl.querySelector('.need-btn').onclick = (e) => {
        e.stopPropagation();
        state.categories[catIdx].items[itemIdx].needed = !item.needed;
        if (!item.needed) delete state.shopChecked[cat.id + '_' + item.name];
        scheduleSave(); renderFull(); updateBadge();
      };
      itemEl.querySelector('.delete-btn').onclick = (e) => {
        e.stopPropagation();
        state.categories[catIdx].items.splice(itemIdx, 1);
        scheduleSave(); renderFull(); updateBadge();
      };
      list.appendChild(itemEl);
    });

    if (!cat.collapsed) {
      const sortable = Sortable.create(list, {
        handle: '.drag-handle', animation: 150,
        ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen', filter: '.add-item',
        onEnd(evt) {
          if (evt.oldIndex === evt.newIndex) return;
          const items = state.categories[catIdx].items;
          const moved = items.splice(evt.oldIndex, 1)[0];
          items.splice(evt.newIndex, 0, moved);
          scheduleSave(); updateBadge();
        }
      });
      sortableInstances.push(sortable);
    }

    const addRow = document.createElement('div');
    addRow.className = 'add-item';
    addRow.innerHTML = `<button class="add-btn-full">+ Añadir producto</button>`;
    addRow.querySelector('.add-btn-full').onclick = () => {
      const val = prompt('Nuevo producto en ' + cat.name + ':');
      if (!val || !val.trim()) return;
      state.categories[catIdx].items.push({ name: val.trim(), needed: false });
      scheduleSave(); renderFull(); updateBadge();
    };

    list.appendChild(addRow);
    catEl.appendChild(header);
    catEl.appendChild(list);
    container.appendChild(catEl);
  });
  updateBadge();
}

function renderShop() {
  const container = document.getElementById('shop-content');
  container.innerHTML = '';
  const needed = [];
  state.categories.forEach(cat => {
    const catNeeded = cat.items.filter(i => i.needed);
    if (catNeeded.length > 0) needed.push({ cat, items: catNeeded });
  });

  if (needed.length === 0) {
    container.innerHTML = `<div class="shop-empty">No hay nada marcado como que falta.<br>Vuelve al inventario y marca lo que necesitas.</div>`;
    return;
  }

  needed.forEach(({ cat, items }) => {
    const section = document.createElement('div');
    section.className = 'shop-category';
    const label = document.createElement('div');
    label.className = 'shop-cat-label';
    label.textContent = cat.emoji + '  ' + cat.name;
    section.appendChild(label);
    items.forEach(item => {
      const key = cat.id + '_' + item.name;
      const checked = !!state.shopChecked[key];
      const itemEl = document.createElement('div');
      itemEl.className = 'shop-item' + (checked ? ' checked' : '');
      itemEl.innerHTML = `<div class="check-circle">${checked ? '✓' : ''}</div><span class="shop-item-name">${item.name}</span>`;
      itemEl.onclick = () => { state.shopChecked[key] = !state.shopChecked[key]; scheduleSave(); renderShop(); };
      section.appendChild(itemEl);
    });
    container.appendChild(section);
  });

  const resetBtn = document.createElement('button');
  resetBtn.className = 'reset-shop';
  resetBtn.textContent = '✓ Compra terminada — limpiar lista';
  resetBtn.onclick = () => {
    if (!confirm('¿Marcar como comprado todo?')) return;
    state.categories.forEach(cat => cat.items.forEach(item => { if (item.needed) item.needed = false; }));
    state.shopChecked = {};
    scheduleSave(); switchView('full');
  };
  container.appendChild(resetBtn);
}

function switchView(view) {
  const fullView = document.getElementById('full-view');
  const shopView = document.getElementById('shopping-view');
  document.getElementById('btn-full-view').classList.toggle('active', view === 'full');
  document.getElementById('btn-shop-view').classList.toggle('active', view === 'shop');
  if (view === 'full') { fullView.classList.remove('hidden'); shopView.classList.remove('active'); renderFull(); }
  else { fullView.classList.add('hidden'); shopView.classList.add('active'); renderShop(); }
}

document.getElementById('btn-clear-all').onclick = () => {
  if (!confirm('¿Quitar todas las marcas?')) return;
  state.categories.forEach(cat => cat.items.forEach(i => i.needed = false));
  state.shopChecked = {};
  scheduleSave(); renderFull(); updateBadge();
};

document.getElementById('btn-logout').onclick = async () => {
  await sb.auth.signOut();
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
};

document.getElementById('btn-google-login').onclick = async () => {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
};

// Init
async function initAuth() {
  // Handle token from URL hash after OAuth redirect
  if (window.location.hash && window.location.hash.includes('access_token')) {
    const { data, error } = await sb.auth.getSessionFromUrl();
    if (data?.session) {
      currentUser = data.session.user;
      // Clean URL
      history.replaceState(null, '', window.location.pathname);
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      await loadFromCloud();
      return;
    }
  }

  // Check existing session
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    await loadFromCloud();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }
}

sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_OUT') {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }
});

initAuth();
</script>
</body>
</html>
